name: easynotes
description: "Easy Notes - Material 3 Offline Note Taking App with Google Play Billing"
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  provider: ^6.1.2
  
  # Local Offline Database (No internet, fast key-value & objects)
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # Google Play In-App Purchase & Billing
  in_app_purchase: ^3.2.0
  in_app_purchase_android: ^0.3.3
  crypto: ^3.0.3

  # UI & Material 3 Utilities
  google_fonts: ^6.2.1
  flutter_staggered_grid_view: ^0.7.0
  animations: ^2.0.11
  intl: ^0.19.0
  uuid: ^4.3.3
  
  # Icons & Haptics
  flutter_svg: ^2.0.10+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  
  # Code generation for Hive TypeAdapters
  build_runner: ^2.4.9
  hive_generator: ^2.0.1
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"

flutter:
  uses-material-design: true

  assets:
    - assets/icon/
