workflows:
  android-release:
    name: Build Android Release AAB
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      flutter: 3.10.6
      java: 17
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'main'
    scripts:
      - name: Get Flutter packages
        script: |
          cd easynotes
          flutter packages pub get
      - name: Build AAB
        script: |
          cd easynotes
          flutter build appbundle --release
    artifacts:
      - easynotes/build/app/outputs/bundle/release/*.aab
